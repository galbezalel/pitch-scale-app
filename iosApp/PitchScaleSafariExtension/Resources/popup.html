<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pitch Scaler</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      width: 260px;
      background: #0F0F12;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }
    h1 { font-size: 16px; letter-spacing: 1px; margin: 0 0 4px; }
    .status { font-size: 12px; color: #00F2FE; margin-bottom: 18px; }
    .semitones { font-size: 28px; font-weight: 700; margin-bottom: 16px; }
    .controls { display: flex; justify-content: center; gap: 32px; margin-bottom: 20px; }
    .circle {
      width: 56px; height: 56px; border-radius: 28px;
      background: #1E1E24; border: 1px solid #2E2E38;
      color: #FFF; font-size: 24px; cursor: pointer;
    }
    .circle:disabled { opacity: 0.3; }
    .power {
      width: 100%; height: 46px; border: none; border-radius: 23px;
      font-weight: 700; font-size: 13px; letter-spacing: 1px; color: #FFF;
      background: linear-gradient(90deg, #00F2FE, #4FACFE);
      cursor: pointer;
    }
    .power.active { background: linear-gradient(90deg, #E21143, #FF5252); }
  </style>
</head>
<body>
  <h1>PITCH SCALER</h1>
  <div id="status" class="status">Ready on this tab</div>
  <div id="semitones" class="semitones">Original Pitch</div>
  <div class="controls">
    <button id="minus" class="circle" disabled>-</button>
    <button id="plus" class="circle" disabled>+</button>
  </div>
  <button id="toggle" class="power">START ENGINE</button>
  <script src="popup.js"></script>
</body>
</html>
